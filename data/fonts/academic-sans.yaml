# Local font pack: copy of the theme's "academic" pack with a sans-serif body.
# Used via `typography.pack: "academic-sans"` in config/_default/params.yaml.
# `style: sans` makes browsers fall back to a sans-serif font if a web font can't load.
# HugoBlox Font Pack
# https://docs.hugoblox.com

hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Academic Sans"
    vendor: "hugoblox"
    version: "1.0.0"
    license: "MIT"
    style: "sans"
    description: "Lora titles and menu with Source Sans 3 text (local copy of the Academic pack)"

  families:
    heading: "Source Sans 3"      # titles
    body: "Source Sans 3" # all other text
    nav: "Source Sans 3"          # top bar: site name and menu
    code: "Source Code Pro"

  weights:
    heading: [500, 600, 700]
    body: [400, 600]
    code: [400]

  leading:
    heading: 1.2
    body: 1.7
    code: 1.5

  tracking:
    heading: "0"
    body: "0"

  variable:
    heading: true
    body: true
    code: false
