# Talks & Workshops
# ─────────────────────────────────────────────────────────────────────────────
# One entry per talk. Shown as a table on /talks/, newest first (order in this
# file does not matter). Copy an entry to add a new one.
#
#   date:        YYYY-MM-DD (required)
#   title:       title of the talk (required)
#   type:        Conference presentation | Invited talk | Invited workshop |
#                Public talk | Panel discussion  (or anything else)
#   event:       name of the conference, seminar series or host (optional)
#   event_url:   link for the event name (optional)
#   location:    institution / venue, city, country
#   description: one or two lines (Markdown allowed)
#   links:       optional list of {name, url}, e.g. Slides, Video, Materials
#
# Only .yaml files may be placed in `data/`. Images or PDFs here break the build.
# ─────────────────────────────────────────────────────────────────────────────

