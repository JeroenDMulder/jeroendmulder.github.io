bio: |
  ## Statistics & Science With Societal Impact

  As a statistician, I develop mathematical models that help scientists turn data into insight into their research questions. My work focuses on advancing longitudinal data analysis methods to answer causal questions and inform intervention- and policy-making. To make these methods count in academia and beyond, I bring them to applied researchers across disciplines through collaborations, consultations, hands-on workshops, and open-source software. 

  Working on a study and need some advice? Or planning a workshop for your team? [Get in touch!](mailto:j.d.mulder@uu.nl)


